name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Publish release assets
    runs-on: ubuntu-latest
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate tag and project version
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})$ ]]
          declared_version=$(sed -nE 's/^BLACKHOST_VERSION="([^"]+)"$/\1/p' lib/core.sh)
          [[ "v${declared_version}" == "$GITHUB_REF_NAME" ]]

      - name: Validate Bash and run tests
        run: |
          find . -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
          bash tests/smoke.sh

      - name: Build verified archive
        run: |
          archive="blackhost-${GITHUB_REF_NAME}.tar.gz"
          git archive \
            --format=tar.gz \
            --prefix="BlackHostCLI-${GITHUB_REF_NAME}/" \
            --output="$archive" \
            "$GITHUB_SHA"
          sha256sum "$archive" >"${archive}.sha256"

      - name: Publish GitHub release
        run: |
          archive="blackhost-${GITHUB_REF_NAME}.tar.gz"
          gh release create "$GITHUB_REF_NAME" \
            "$archive" "${archive}.sha256" \
            --verify-tag \
            --title "BlackHost CLI ${GITHUB_REF_NAME}" \
            --generate-notes
